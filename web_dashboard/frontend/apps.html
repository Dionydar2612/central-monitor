<!DOCTYPE html>
<!--
  apps.html - หน้า Apps & Web: โปรแกรม / เว็บ / พอร์ต ยังทำงานไหม (มุมมองแบบง่าย)
    ข้อมูล: GET /api/apps (กฎใน Custom alert rules ชนิดโปรแกรม / service / เว็บ / พอร์ต + สถานะจาก sensor)
    admin เพิ่ม / ลบรายการได้จากหน้านี้ (POST / DELETE /api/apps)
-->
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Central Monitor - Apps &amp; Web</title>
<link rel="stylesheet" href="/dashboard.css">
</head>
<body>
<div class="wrap">
<header>
<div><b>Apps &amp; Web</b></div>
<div class="sbadges" id="sbadges"></div>
<div class="user"><a class="st-nav" href="/">&larr; Dashboard</a><a class="st-nav" href="/events">Status &amp; Logs</a><span>Logged in as <b id="currentUsername">...</b></span><a class="st-nav" href="/settings" id="settingsLink" hidden>Settings</a><button id="logoutButton">Logout</button></div>
</header>

<section class="card apHero" id="apHero"><span class="apBig"></span><div><h1 id="apHeadline">กำลังโหลด...</h1><small id="apSub"></small></div></section>

<div class="apBar" id="apBar">
<button type="button" class="apChip" data-f="all" aria-pressed="true">ทั้งหมด<b id="cAll"></b></button>
<button type="button" class="apChip" data-f="problem" aria-pressed="false">มีปัญหา<b id="cBad"></b></button>
<button type="button" class="apChip" data-f="program" aria-pressed="false">โปรแกรม</button>
<button type="button" class="apChip" data-f="service" aria-pressed="false">Service</button>
<button type="button" class="apChip" data-f="web" aria-pressed="false">เว็บ</button>
<button type="button" class="apChip" data-f="port" aria-pressed="false">พอร์ต</button>
<button type="button" class="apChip" data-f="docker" aria-pressed="false">Docker</button>
<input type="search" id="apFind" placeholder="ค้นหาชื่อ / เครื่อง" autocomplete="off">
<button type="button" class="apChip" id="apAddBtn" hidden>+ เพิ่ม</button>
</div>

<form class="card apAdd" id="apForm" hidden>
<label>ประเภท<span class="seg" id="apType"><button type="button" data-t="program" aria-pressed="true">โปรแกรม</button><button type="button" data-t="web" aria-pressed="false">เว็บ</button><button type="button" data-t="port" aria-pressed="false">พอร์ต</button><button type="button" data-t="service" aria-pressed="false">Service</button><button type="button" data-t="docker" aria-pressed="false">Docker</button></span></label>
<label>เครื่อง<select id="apWeb"></select></label>
<label><span id="apValLabel">ชื่อโปรแกรม</span><input id="apVal" list="apSuggest" autocomplete="off"><datalist id="apSuggest"></datalist><small class="apMode" id="apMode" hidden></small></label>
<label>ชื่อที่แสดง (ไม่บังคับ)<input id="apName" autocomplete="off" placeholder="เช่น ระบบบัญชี"></label>
<div class="apBtns"><button type="submit" class="primary" id="apSave">เพิ่ม</button><button type="button" id="apCancel">ยกเลิก</button></div>
<div class="apWhere" id="apWhere" hidden><span>ตรวจจาก</span><span class="seg" id="apLocal"><button type="button" data-l="1" aria-pressed="true">บนเครื่องเอง (localhost)</button><button type="button" data-l="0" aria-pressed="false">central เรียก IP ของเครื่อง</button></span></div>
<div class="apPorts" id="apPorts" hidden></div>
<details class="apMore" id="apMore" hidden><summary>ตั้งค่าเพิ่มเติม (ไม่บังคับ)</summary>
<div class="apMoreGrid">
<label>คำที่ต้องมีในหน้า<input id="apKw" autocomplete="off" placeholder="เช่น Login (เฉพาะตรวจจาก central)"></label>
<label>เตือนเมื่อตอบช้ากว่า (ms)<input id="apSlow" inputmode="numeric" placeholder="เช่น 2000"></label>
<label>เตือน SSL ก่อนหมดอายุ (วัน)<input id="apSsl" inputmode="numeric" placeholder="เช่น 14 (เฉพาะ https จาก central)"></label>
<label>ต้องผิดปกติต่อเนื่อง (นาที)<input id="apFor" inputmode="decimal" placeholder="2"></label>
</div></details>
<div class="apHint" id="apHint"></div>
<div class="apMsg" id="apMsg"></div>
</form>

<div class="apGrid" id="apGrid"></div>

<!-- หน้ารายละเอียดของ Monitor เว็บ (คลิกการ์ดเว็บ หรือ /apps?open=<rule>&web=<เครื่อง>) -->
<div class="apModal" id="apDetail" hidden><div class="apMBox card" role="dialog" aria-modal="true" aria-labelledby="adName">
<div class="apMHead"><span class="apBig" id="adDot"></span><div style="min-width:0;flex:1"><h2 id="adName">-</h2><small id="adSub"></small></div>
<div class="tabs" id="adRange"><button type="button" data-r="1h">1h</button><button type="button" data-r="24h" aria-pressed="true">24h</button><button type="button" data-r="7d">7d</button><button type="button" data-r="30d">30d</button></div>
<button type="button" class="svbtn" id="adEdit" hidden>✎ แก้ไข</button><button type="button" class="svbtn" id="adClose">ปิด</button></div>
<div class="apStats" id="adStats"></div>
<div class="apChart" id="adChart"></div>
<div class="apMsgLine" id="adMsg"></div>
<h3 class="apH3">ประวัติปัญหา (30 วัน)</h3><div id="adInc"></div>
<div class="apSet" id="adSet"></div>
</div></div>
</div>
<script src="/badges.js"></script>
<script src="/popup.js"></script>
<script src="/apps.js"></script>
</body>
</html>
